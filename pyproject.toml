[project]
name = "eikohelp"
version = "0.1.0"
description = "电商智能客服 Agent:订单物流、FAQ 检索问答、退款子流程、知识飞轮、主题分类器微调"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eiko" }]
requires-python = ">=3.12"
keywords = ["ai-agent", "customer-service", "rag", "langgraph", "mcp", "fastapi", "milvus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiosqlite>=0.20",
    "asyncmy>=0.2.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.3.13",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.28.1",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "pymilvus[milvus-lite]>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
# ch10 训练/导出重依赖:主应用运行时不需要,uv run --group ml 按需装
ml = [
    "torch>=2.6",
    "transformers>=4.46",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
